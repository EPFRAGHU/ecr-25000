server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }
    location /vendor/ { expires 30d; }
    location /files/ {
        types { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx; }
        add_header Content-Disposition "attachment";
    }
    location / { try_files $uri $uri/ /index.html; }
}
